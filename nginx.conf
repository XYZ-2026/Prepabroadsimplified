# Nginx Configuration for CLARVO on Hostinger VPS
# Place or symlink to: /etc/nginx/sites-available/clarvo.in
# Enable with: sudo ln -s /etc/nginx/sites-available/clarvo.in /etc/nginx/sites-enabled/
# Test with: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name clarvo.in www.clarvo.in;

    # Maximum file upload size (e.g. for student documents / PDFs)
    client_max_body_size 50M;

    # Next.js Application running inside Docker container published on host port 4000
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSockets & Server-Sent Events support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real client IP and SSL termination headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for longer PDF report generation & AI analysis
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;

        # Cache bypass
        proxy_cache_bypass $http_upgrade;
    }
}
