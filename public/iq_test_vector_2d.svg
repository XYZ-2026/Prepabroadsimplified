<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <rect width="400" height="220" fill="#FFFFFF"/>

  <!-- Background Tint Circle -->
  <circle cx="200" cy="110" r="90" fill="#FDF4F4"/>

  <!-- Head Silhouette & Brain Logic Connections -->
  <g transform="translate(130, 25)">
    <!-- Head Outline -->
    <path d="M 40 160 C 20 150 10 120 10 90 C 10 45 45 10 90 10 C 135 10 170 45 170 90 C 170 120 150 145 130 160 L 130 175 L 40 175 Z" fill="#111827"/>
    
    <!-- Lightbulb / Brain Logic Core -->
    <g transform="translate(60, 35)">
      <!-- Interconnected Logic Nodes -->
      <line x1="30" y1="30" x2="60" y2="15" stroke="#690b1b" stroke-width="3"/>
      <line x1="60" y1="15" x2="90" y2="35" stroke="#690b1b" stroke-width="3"/>
      <line x1="30" y1="30" x2="35" y2="70" stroke="#690b1b" stroke-width="3"/>
      <line x1="35" y1="70" x2="85" y2="70" stroke="#690b1b" stroke-width="3"/>
      <line x1="60" y1="15" x2="35" y2="70" stroke="#690b1b" stroke-width="3"/>
      <line x1="90" y1="35" x2="85" y2="70" stroke="#690b1b" stroke-width="3"/>

      <!-- Node Dots -->
      <circle cx="30" cy="30" r="7" fill="#FFFFFF" stroke="#690b1b" stroke-width="3"/>
      <circle cx="60" cy="15" r="9" fill="#690b1b"/>
      <circle cx="90" cy="35" r="7" fill="#FFFFFF" stroke="#690b1b" stroke-width="3"/>
      <circle cx="35" cy="70" r="8" fill="#690b1b"/>
      <circle cx="85" cy="70" r="8" fill="#690b1b"/>
    </g>

    <!-- Gear Mechanism overlay -->
    <g transform="translate(105, 95)" fill="#690b1b">
      <circle cx="20" cy="20" r="16" fill="#690b1b"/>
      <circle cx="20" cy="20" r="6" fill="#111827"/>
    </g>
  </g>

  <!-- Left Stats Badge -->
  <g transform="translate(30, 75)">
    <rect width="100" height="28" rx="14" fill="#690b1b"/>
    <text x="14" y="18" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">🧠 IQ SCORE</text>
  </g>

  <!-- Right Percentile Badge -->
  <g transform="translate(270, 75)">
    <rect width="100" height="28" rx="14" fill="#111827"/>
    <text x="14" y="18" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">TOP 1% RANK</text>
  </g>
</svg>
