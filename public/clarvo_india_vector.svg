<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
  </defs>

  <rect width="420" height="320" rx="14" fill="#FFFFFF" />

  <!-- Background Ambient Glow & Grid -->
  <circle cx="210" cy="160" r="130" fill="url(#bgGlow)" />
  <g opacity="0.08" stroke="#080F1C" stroke-width="1">
    <line x1="0" y1="80" x2="420" y2="80" />
    <line x1="0" y1="160" x2="420" y2="160" />
    <line x1="0" y1="240" x2="420" y2="240" />
    <line x1="105" y1="0" x2="105" y2="320" />
    <line x1="210" y1="0" x2="210" y2="320" />
    <line x1="315" y1="0" x2="315" y2="320" />
  </g>

  <!-- Career Pathway Radiating Arcs -->
  <path d="M 120 230 C 180 120, 260 120, 340 180" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="5,5" opacity="0.5" />
  <path d="M 80 200 C 160 80, 270 90, 360 140" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,4" opacity="0.4" />

  <!-- University Dome & Pillars (Premier Indian & Global Institutes) in Background -->
  <g transform="translate(235, 125)" opacity="0.95">
    <!-- Pediment Roof -->
    <polygon points="65,15 0,45 130,45" fill="url(#primaryGrad)" />
    <!-- Dome Top -->
    <path d="M 45 15 C 45 -5, 85 -5, 85 15 Z" fill="#080F1C" />
    <rect x="63" y="-12" width="4" height="8" fill="#2563EB" />
    <!-- Architrave -->
    <rect x="6" y="45" width="118" height="8" fill="#080F1C" rx="1" />
    <!-- Pillars -->
    <rect x="18" y="53" width="14" height="60" rx="2" fill="#080F1C" />
    <rect x="46" y="53" width="14" height="60" rx="2" fill="#080F1C" />
    <rect x="74" y="53" width="14" height="60" rx="2" fill="#080F1C" />
    <rect x="102" y="53" width="14" height="60" rx="2" fill="#080F1C" />
    <!-- Steps Base -->
    <rect x="10" y="113" width="114" height="8" fill="url(#primaryGrad)" rx="2" />
    <rect x="2" y="121" width="130" height="9" fill="#080F1C" rx="2" />
  </g>

  <!-- Aspiring Indian Student Vector (Foreground Left) -->
  <g transform="translate(90, 85)">
    <!-- Shadow -->
    <ellipse cx="60" cy="205" rx="42" ry="7" fill="#080F1C" opacity="0.12" />

    <!-- Blazer Body -->
    <path d="M 24 135 Q 60 110 96 135 L 105 205 L 15 205 Z" fill="url(#primaryGrad)" />
    <!-- Inner Shirt & Silk Tie -->
    <polygon points="60,118 50,150 70,150" fill="#FFFFFF" />
    <polygon points="60,126 56,165 60,175 64,165" fill="#080F1C" />
    
    <!-- Neck & Face -->
    <rect x="54" y="105" width="12" height="15" fill="#FED7AA" />
    <ellipse cx="60" cy="92" rx="22" ry="24" fill="#FED7AA" />
    <!-- Sleek Hair -->
    <path d="M 38 88 C 38 65 82 65 82 88 C 82 72 72 66 60 66 C 48 66 38 72 38 88 Z" fill="#080F1C" />

    <!-- Graduation Mortarboard / Academic Cap -->
    <polygon points="60,52 105,68 60,84 15,68" fill="#080F1C" />
    <rect x="44" y="73" width="32" height="12" fill="url(#primaryGrad)" rx="2" />
    <circle cx="60" cy="68" r="3.5" fill="#F59E0B" />
    <path d="M 60 68 Q 88 70 92 95" stroke="#F59E0B" stroke-width="2.5" fill="none" />
    <circle cx="92" cy="97" r="3" fill="#F59E0B" />

    <!-- Smart Tablet / Career Portfolio held by student -->
    <g transform="translate(16, 145) rotate(-12)">
      <rect x="0" y="0" width="34" height="46" rx="4" fill="#080F1C" stroke="#2563EB" stroke-width="1.5" />
      <rect x="4" y="4" width="26" height="38" rx="2" fill="#FFFFFF" />
      <!-- Chart / Trait Lines on screen -->
      <line x1="8" y1="12" x2="26" y2="12" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
      <line x1="8" y1="18" x2="20" y2="18" stroke="#080F1C" stroke-width="2" stroke-linecap="round" />
      <path d="M 8 32 L 14 26 L 19 29 L 26 22" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Floating Achievement Badge 1 (Top Left): 147+ Career Roadmaps -->
  <g transform="translate(24, 38)">
    <rect width="134" height="30" rx="15" fill="#080F1C" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />
    <circle cx="16" cy="15" r="9" fill="#2563EB" />
    <text x="12" y="19" font-size="10" fill="#FFFFFF">🎯</text>
    <text x="32" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">147+ Roadmaps</text>
  </g>

  <!-- Floating Achievement Badge 2 (Top Right): Top Colleges & Streams -->
  <g transform="translate(252, 38)">
    <rect width="144" height="30" rx="15" fill="#2563EB" filter="drop-shadow(0 4px 6px rgba(37,99,235,0.25))" />
    <circle cx="16" cy="15" r="9" fill="#FFFFFF" />
    <text x="11" y="19" font-size="10" fill="#2563EB">🇮🇳</text>
    <text x="32" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Top Colleges &amp; Streams</text>
  </g>

  <!-- Subtle Indian Tricolor Brand Bar at bottom edge of the graphic -->
  <g transform="translate(160, 298)">
    <rect x="0" y="0" width="34" height="3.5" rx="1.5" fill="#FF9933" />
    <rect x="36" y="0" width="34" height="3.5" rx="1.5" fill="#CBD5E1" />
    <rect x="72" y="0" width="34" height="3.5" rx="1.5" fill="#138808" />
  </g>
</svg>
