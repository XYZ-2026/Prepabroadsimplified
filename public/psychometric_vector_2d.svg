<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <rect width="400" height="220" fill="#FFFFFF"/>

  <!-- Background Tint Circle -->
  <circle cx="200" cy="110" r="90" fill="#FDF4F4"/>

  <!-- Psychometric Career Compass & Radar Graph -->
  <g transform="translate(130, 20)">
    <!-- Radar Graph Web -->
    <polygon points="70,10 130,40 130,110 70,140 10,110 10,40" stroke="#111827" stroke-width="2" fill="none" opacity="0.2"/>
    <polygon points="70,30 110,50 110,100 70,120 30,100 30,50" stroke="#111827" stroke-width="1.5" fill="none" opacity="0.2"/>

    <!-- Radar Score Shape (Deep Maroon Accent) -->
    <polygon points="70,15 125,45 105,95 70,115 35,90 25,45" fill="#690b1b" opacity="0.75" stroke="#690b1b" stroke-width="3"/>

    <!-- Axis Center Lines -->
    <line x1="70" y1="10" x2="70" y2="140" stroke="#111827" stroke-width="2"/>
    <line x1="10" y1="40" x2="130" y2="110" stroke="#111827" stroke-width="2"/>
    <line x1="10" y1="110" x2="130" y2="40" stroke="#111827" stroke-width="2"/>

    <!-- Data Nodes -->
    <circle cx="70" cy="15" r="5" fill="#111827"/>
    <circle cx="125" cy="45" r="5" fill="#111827"/>
    <circle cx="105" cy="95" r="5" fill="#111827"/>
    <circle cx="70" cy="115" r="5" fill="#111827"/>
    <circle cx="35" cy="90" r="5" fill="#111827"/>
    <circle cx="25" cy="45" r="5" fill="#111827"/>
  </g>

  <!-- Left Trait Pill -->
  <g transform="translate(25, 60)">
    <rect width="95" height="26" rx="13" fill="#690b1b"/>
    <text x="12" y="17" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">🎯 CAREER FIT</text>
  </g>

  <g transform="translate(25, 100)">
    <rect width="95" height="26" rx="13" fill="#111827"/>
    <text x="12" y="17" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">📊 TRAIT MAP</text>
  </g>

  <!-- Right Trait Pill -->
  <g transform="translate(280, 80)">
    <rect width="95" height="26" rx="13" fill="#690b1b"/>
    <text x="12" y="17" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">✨ REPORT AI</text>
  </g>
</svg>
