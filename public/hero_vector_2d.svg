<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#FFFFFF"/>
  
  <!-- Background Subtle Grid -->
  <g opacity="0.05" stroke="#111827" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
  </g>

  <!-- Globe Circles & Meridians -->
  <g stroke="#690b1b" stroke-width="2.5" fill="none" opacity="0.85">
    <circle cx="360" cy="200" r="120" stroke="#111827" stroke-width="3" fill="#FDF4F4"/>
    <ellipse cx="360" cy="200" rx="120" ry="45"/>
    <ellipse cx="360" cy="200" rx="45" ry="120"/>
    <line x1="240" y1="200" x2="480" y2="200"/>
    <line x1="360" y1="80" x2="360" y2="320"/>
  </g>

  <!-- Flight Path Arc -->
  <path d="M 180 260 Q 300 60 480 140" fill="none" stroke="#690b1b" stroke-width="3" stroke-dasharray="6,6"/>
  <!-- Airplane Icon -->
  <g transform="translate(470, 130) rotate(25)">
    <polygon points="0,0 24,-8 18,0 24,8" fill="#690b1b"/>
  </g>

  <!-- University Dome Landmark (Right Background) -->
  <g transform="translate(420, 220)" fill="#111827">
    <path d="M10 80 L10 40 Q40 0 70 40 L70 80 Z"/>
    <rect x="0" y="80" width="80" height="8" rx="2"/>
    <rect x="15" y="45" width="10" height="25" fill="#FFFFFF"/>
    <rect x="35" y="45" width="10" height="25" fill="#FFFFFF"/>
    <rect x="55" y="45" width="10" height="25" fill="#FFFFFF"/>
  </g>

  <!-- Student Character 2D Vector (Left Foreground) -->
  <g transform="translate(130, 110)">
    <!-- Shadow -->
    <ellipse cx="60" cy="260" rx="50" ry="8" fill="#111827" opacity="0.1"/>
    
    <!-- Body / Suit Jacket -->
    <path d="M 20 170 Q 60 140 100 170 L 110 260 L 10 260 Z" fill="#690b1b"/>
    <!-- Inner Shirt & Tie -->
    <polygon points="60,150 48,190 72,190" fill="#FFFFFF"/>
    <polygon points="60,160 55,210 60,220 65,210" fill="#111827"/>
    
    <!-- Head & Hair -->
    <circle cx="60" cy="115" r="28" fill="#111827"/>
    <!-- Face -->
    <path d="M 45 110 Q 60 145 75 110 Z" fill="#FFE5E5"/>
    
    <!-- Graduation Cap (Tassel & Mortarboard) -->
    <polygon points="60,70 110,88 60,106 10,88" fill="#111827"/>
    <rect x="42" y="94" width="36" height="14" fill="#690b1b" rx="3"/>
    <circle cx="60" cy="88" r="4" fill="#690b1b"/>
    <path d="M 60 88 Q 90 90 95 120" stroke="#690b1b" stroke-width="2.5" fill="none"/>
    <circle cx="95" cy="122" r="3" fill="#690b1b"/>

    <!-- Binder / Passport Folder held by student -->
    <rect x="15" y="180" width="35" height="50" rx="4" fill="#111827" transform="rotate(-15)"/>
    <rect x="22" y="190" width="20" height="5" fill="#690b1b" transform="rotate(-15)"/>
    <text x="22" y="215" font-size="8" font-family="sans-serif" font-weight="bold" fill="#FFFFFF" transform="rotate(-15)">ABROAD</text>
  </g>

  <!-- Floating Achievement Pins -->
  <g transform="translate(100, 70)">
    <rect width="110" height="34" rx="17" fill="#111827"/>
    <circle cx="18" cy="17" r="10" fill="#690b1b"/>
    <text x="14" y="21" font-size="12" fill="#FFFFFF">🎓</text>
    <text x="34" y="22" font-size="11" font-family="sans-serif" font-weight="bold" fill="#FFFFFF">500+ Unis</text>
  </g>

  <g transform="translate(420, 70)">
    <rect width="120" height="34" rx="17" fill="#690b1b"/>
    <circle cx="18" cy="17" r="10" fill="#111827"/>
    <text x="14" y="21" font-size="12" fill="#FFFFFF">✈️</text>
    <text x="34" y="22" font-size="11" font-family="sans-serif" font-weight="bold" fill="#FFFFFF">40+ Countries</text>
  </g>
</svg>
