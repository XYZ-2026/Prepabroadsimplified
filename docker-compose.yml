# ============================================================
# Abroad Simplified — Docker Compose (Production VPS)
# ============================================================

services:
  abroad-simplified-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abroad-simplified
    ports:
      - "${APP_PORT:-4000}:3000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    # Resource limits to prevent OOM on VPS
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    # Logging — keep logs bounded so they don't fill VPS disk
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # Chromium in containers needs /dev/shm or --disable-dev-shm-usage
    shm_size: "256mb"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
