<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <rect width="400" height="220" fill="#FFFFFF"/>
  
  <!-- Subtle Background Pattern -->
  <circle cx="200" cy="110" r="90" fill="#FDF4F4"/>

  <!-- University Pillars & Facade -->
  <g transform="translate(110, 40)" fill="#111827">
    <!-- Pediment (Roof Triangle) -->
    <polygon points="90,10 0,50 180,50" fill="#690b1b"/>
    <rect x="10" y="50" width="160" height="10" fill="#111827"/>
    
    <!-- 4 Pillars -->
    <rect x="25" y="60" width="18" height="70" rx="2" fill="#111827"/>
    <rect x="65" y="60" width="18" height="70" rx="2" fill="#111827"/>
    <rect x="105" y="60" width="18" height="70" rx="2" fill="#111827"/>
    <rect x="145" y="60" width="18" height="70" rx="2" fill="#111827"/>
    
    <!-- Base Steps -->
    <rect x="5" y="130" width="170" height="12" fill="#690b1b"/>
    <rect x="0" y="142" width="180" height="10" fill="#111827"/>
  </g>

  <!-- Search Glass & Target Pin (Right Overlay) -->
  <g transform="translate(220, 70)">
    <!-- Lens Handle -->
    <line x1="60" y1="60" x2="105" y2="105" stroke="#690b1b" stroke-width="12" stroke-linecap="round"/>
    <!-- Glass Circle -->
    <circle cx="45" cy="45" r="40" fill="#FFFFFF" stroke="#690b1b" stroke-width="7"/>
    <circle cx="45" cy="45" r="30" fill="none" stroke="#111827" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="32" y="53" font-size="22" fill="#690b1b">🎓</text>
  </g>

  <!-- Filter Badges -->
  <g transform="translate(30, 60)">
    <rect width="90" height="26" rx="13" fill="#690b1b"/>
    <text x="12" y="17" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">500+ UNIS</text>
  </g>

  <g transform="translate(30, 100)">
    <rect width="95" height="26" rx="13" fill="#111827"/>
    <text x="12" y="17" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">TOP RANK</text>
  </g>

  <g transform="translate(30, 140)">
    <rect width="110" height="26" rx="13" fill="#690b1b"/>
    <text x="12" y="17" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">SCHOLARSHIP</text>
  </g>
</svg>
